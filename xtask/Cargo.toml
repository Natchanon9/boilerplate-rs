[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Dev tasks, run as `cargo xtask <task>` (the alias is in .cargo/config.toml).
# Never a dependency of the app (docs/conventions/stack-architecture.md, crate map).

[dependencies]
clap = { workspace = true }
dotenvy = { workspace = true }
jsonwebtoken = { workspace = true }
# kafka-produce sends with rdkafka. deny.toml lists xtask as a wrapper for it.
rdkafka = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
uuid = { workspace = true }

[lints]
workspace = true
