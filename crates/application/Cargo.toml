[package]
name = "application"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Deserialize for input::Field<T> and UnknownFields, enabled by the inbound adapters only
# (docs/conventions/stack-architecture.md, crate map).
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
# `task_local!` for cache_status only (docs/conventions/stack-architecture.md, crate map).
tokio = { workspace = true, features = ["rt"] }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
