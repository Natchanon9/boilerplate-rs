# Local stack: postgres, redis, kafka (KRaft), kafka-ui, and the app
# (docs/conventions/stack-architecture.md AC-3). Start it with `make up`.
#
# Redis is in profile `cache`, and kafka, kafka-init, and kafka-ui are in profile `kafka`.
# A service with no profile always starts; a service with a profile starts only when that
# profile is active (https://docs.docker.com/compose/how-tos/profiles/). `make up` activates
# the profile of each feature named in ENABLE_FEATURES (docs/conventions/runtime.md); a fresh
# clone with ENABLE_FEATURES empty starts only postgres, migrate, and the app.
#
# Infrastructure ports and the hidden router are published on 127.0.0.1 only, so local
# tools reach them while the network cannot (docs/conventions/runtime.md, own proposal).

name: rs-boilerplate

# Log rotation for every container. Docker's default json-file driver keeps logs forever;
# the local driver rotates by default (max-size 20m, max-file 5, compressed), and Docker
# recommends it to prevent disk exhaustion
# (https://docs.docker.com/engine/logging/configure/, https://docs.docker.com/engine/logging/drivers/local/).
x-logging: &logging
  driver: local

# While a container starts, probe every second instead of the 5 s start interval, so `up`
# waits seconds rather than the 30 s default interval
# (https://docs.docker.com/reference/dockerfile/#healthcheck). 60 s and 1 s: own proposal,
# enough for Kafka's first start on a laptop.
x-healthcheck-timing: &healthcheck-timing
  start_period: 60s
  start_interval: 1s

services:
  postgres:
    logging: *logging
    image: postgres:18.6
    environment:
      # Local development credentials only.
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      <<: *healthcheck-timing

  redis:
    logging: *logging
    image: redis:8.10.2
    profiles: [cache]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-timing

  # Single-node KRaft broker. Listener names, ports, and the cluster id follow the Apache
  # Kafka single-node example (https://github.com/apache/kafka/blob/trunk/docker/examples/docker-compose-files/single-node/plaintext/docker-compose.yml):
  # PLAINTEXT_HOST on localhost:9092 for the host, PLAINTEXT on kafka:19092 for containers.
  kafka:
    logging: *logging
    # The apache/kafka image declares VOLUMEs at these paths. Mounting tmpfs over them stops
    # Docker from creating anonymous volumes that outlive the container. Kafka's data is
    # in KAFKA_LOG_DIRS (/tmp) anyway.
    tmpfs:
      - /var/lib/kafka/data
      - /etc/kafka/secrets
      - /mnt/shared/config
    image: apache/kafka:4.3.1
    profiles: [kafka]
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # No volume: the local broker is disposable, and kafka-init recreates the topics.
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      <<: *healthcheck-timing

  # Creates the command topics once, then exits (docs/conventions/kafka.md, Topic setup):
  # 3 partitions and replication factor 1, both own proposals there. A new resource with
  # Kafka commands adds `<res_plural>.commands.v1` and its `.dlq` to TOPICS.
  kafka-init:
    logging: *logging
    # The apache/kafka image declares VOLUMEs at these paths. Mounting tmpfs over them stops
    # Docker from creating anonymous volumes that outlive the container. Kafka's data is
    # in KAFKA_LOG_DIRS (/tmp) anyway.
    tmpfs:
      - /var/lib/kafka/data
      - /etc/kafka/secrets
      - /mnt/shared/config
    image: apache/kafka:4.3.1
    profiles: [kafka]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # Empty in the bare boilerplate. Each resource with Kafka commands adds its two topics.
      TOPICS: ""
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in $$TOPICS; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 3 --replication-factor 1
        done
    restart: "no"

  kafka-ui:
    logging: *logging
    image: kafbat/kafka-ui:v1.5.0
    profiles: [kafka]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      # 8090 on the host because the protected router uses 8080 (own proposal).
      - "127.0.0.1:8090:8080"

  migrate:
    logging: *logging
    build: .
    image: rs-boilerplate:local
    command: ["db", "migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One container runs `all`, so HTTP and the consumer share one environment
  # (docs/conventions/runtime.md, Compose topology).
  app:
    logging: *logging
    image: rs-boilerplate:local
    command: ["all"]
    env_file: .env
    # The consumer exits non-zero when it cannot write a message to the DLQ, and the message
    # stays uncommitted, so a restart reads it again (docs/conventions/kafka.md, Consumer
    # semantics; https://docs.docker.com/engine/containers/start-containers-automatically/).
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:19092
    ports:
      - "${PROTECTED_API_PORT:-8080}:${PROTECTED_API_PORT:-8080}"
      - "${PUBLIC_API_PORT:-8081}:${PUBLIC_API_PORT:-8081}"
      - "127.0.0.1:${HIDDEN_API_PORT:-8079}:${HIDDEN_API_PORT:-8079}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # `required: false` lets the app start when the profile of redis or kafka-init is off;
      # Compose then only warns that the dependency is not started
      # (https://docs.docker.com/reference/compose-file/services/#depends_on).
      redis:
        condition: service_healthy
        required: false
      kafka-init:
        condition: service_completed_successfully
        required: false

volumes:
  postgres-data:
